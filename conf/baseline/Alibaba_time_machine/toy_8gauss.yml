cond_model: iTransformer
dropout: 0.05
embed: 'timeF'
activation: 'gelu'
output_attention: False
channel_independence: 1 #help='0: channel dependence 1: channel independence for FreTS model'
decomp_method: 'moving_avg' #help='method of series decompsition, only support moving_avg or dft_decomp')
use_norm: 1 #help='whether to use normalize; True 1 False 0'
down_sampling_layers: 3   #help='whether to use normalize; True 1 False 0'
down_sampling_window: 2   #help='num of down sampling layers'
down_sampling_method: 'avg' #help='down sampling method, only support avg, max, conv'


# PatchDN
denoise_model: PatchDN
patch_size: 16
stride: 4
padding_patch: 'end'
depth: 1
d_model_d: 256
n_heads_d: 8

# U-Net
ddpm_inp_embed: 256
ddpm_dim_diff_steps: 256
ddpm_channels_conv: 256
ddpm_channels_fusion_I: 256
ddpm_layers_inp: 5
ddpm_layers_I: 5
ddpm_layers_II: 5
cond_ddpm_num_layers: 5
cond_ddpm_channels_conv: 64
# Series Decomposition
decomposition: False
kernel_size: 15
fourier_factor: 1.0


seg_len: 96


#augmentation_ratio
augmentation_ratio: 0  # How many times to augment
jitter: false  # Jitter preset augmentation
scaling: false  # Scaling preset augmentation
permutation: false  # Equal Length Permutation preset augmentation
randompermutation: false  # Random Length Permutation preset augmentation
magwarp: false  # Magnitude warp preset augmentation
timewarp: false  # Time warp preset augmentation
windowslice: false  # Window slice preset augmentation
windowwarp: false  # Window warp preset augmentation
rotation: false  # Rotation preset augmentation
spawner: false  # SPAWNER preset augmentation
dtwwarp: false  # DTW warp preset augmentation
shapedtwwarp: false  # Shape DTW warp preset augmentation
wdba: false  # Weighted DBA preset augmentation
discdtw: false  # Discriminative DTW warp preset augmentation
discsdtw: false  # Discriminative shape DTW warp preset augmentation
extra_tag: ""  # Anything extra


# CART related args
cond_pred_model_pertrain_dir: './result/tmdm/cond_pred_model_pertrain_NS_Transformer/checkpoint.pth????'
CART_input_x_embed_dim: 32
mse_timestep: 0
MLP_diffusion_net: False

# Some args for Ax (all about diffusion part)
timesteps: 1000
sampling_timesteps: 50
fastsample: False
type_sampler: 'DDIM'
DPMsolver_step: 20
eta: 1
parameterization: 'noise'
bias: False
use_pretraining_condition: False

# rebuttal exps
cond_pred_model_requires_grad: False
from_scrach: False
scrach_10_stop: False
bias_y_0: False

# PatchTST
fc_dropout: 0.05
head_dropout: 0.0

# NSformer
p_hidden_dims: [64, 64]
p_hidden_layers: 2

# Sparse-VQ
wFFN: 1
svq: 1
codebook_size: 128
sout: 0
individual: 0
revin: 1
affine: 0
subtract_last: 0
length: 96
num_codebook: 4

# iTransformer
use_norm: 1

data:
    dataset: "8gauss"
    true_function: None
    dataset_size: 10240
    seed: 2000
    no_multimodality: False
    inverse_xy: False
    x_dict: {"ct_toy_name": "8gaussians"}
    noise_dict: {}
    train_ratio: 0.8
    num_workers: 0
    normalize_x: False
    normalize_y: False

model:
    type: "simple"
    data_dim: 2
    x_dim: 1
    y_dim: 1
    z_dim: 2
    cat_x: True
    cat_y_pred: True
    feature_dim: 128
    var_type: fixedlarge
    ema_rate: 0.9999
    ema: True

diffusion:
    beta_schedule: linear  # cosine_anneal
    beta_start: 0.0001
    beta_end: 0.1
    timesteps: 1000
    vis_step: 100
    num_figs: 10
    conditioning_signal: "NN"
    nonlinear_guidance:
        pre_train: True
        joint_train: False
        n_pretrain_epochs: 100
        logging_interval: 10
        hid_layers: [100, 50]
        use_batchnorm: False
        negative_slope: 0.01
        dropout_rate: 0.0
        apply_early_stopping: False
        n_pretrain_max_epochs: 1000
        train_ratio: 0.6  # for splitting original train into train and validation set for hyperparameter tuning
        patience: 50
        delta: 0  # hyperparameter for improvement measurement in the early stopping scheme

training:
    batch_size: 256
    n_epochs: 5000
    n_iters: 100000
    snapshot_freq: 1000000000
    logging_freq: 1000
    validation_freq: 128000
    image_folder: 'training_image_samples'

sampling:
    batch_size: 32
    sampling_size: 1000
    last_only: True
    image_folder: 'sampling_image_samples'

testing:
    batch_size: 32
    sampling_size: 1000
    last_only: True
    plot_freq: 200
    image_folder: 'testing_image_samples'
    n_z_samples: 100 #1000
    n_z_samples_depart: 1 #1000
    n_bins: 10

    compute_metric_all_steps: True
    mean_t: 0
    coverage_t: 0
    nll_t: 0
    vis_t: 0
    trimmed_mean_range: [0.0, 100.0]
    PICP_range: [2.5, 97.5]
    make_plot: True
    squared_plot: True
    plot_true: True
    plot_gen: True
    fig_size: [8, 5]
    one_fig_size: [4, 4]

optim:
    weight_decay: 0.000
    optimizer: "Adam"
    lr: 0.001
    beta1: 0.9
    amsgrad: false
    eps: 0.00000001
    grad_clip: 1.0

aux_optim:
    weight_decay: 0.000
    optimizer: "Adam"
    lr: 0.001
    beta1: 0.9
    amsgrad: True
    eps: 0.00000001
    grad_clip: 1.0
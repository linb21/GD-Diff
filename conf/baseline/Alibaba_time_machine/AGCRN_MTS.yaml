# data
data_path: data/Alibaba/cpu_util_percent_selected_machines_100_1min_no_time_stamp.parquet
pre_graph_path: data/ori_data/distance.npy
train_val_test_ratio: [0.7, 0.1, 0.2]

# Training
dataset_name: TS_Dataset
model_name: agcrn
trainer_name: AGCRN_trainer
loss_name: MAE
use_gpu: True
use_multi_gpu: False
devices: '5'
gpu: 0
seed: 9432
lradj: 'TST'
patience: 5
learning_rate: 0.001
pct_start: 0.2
epochs: 100
in_len: 60
out_len: 6
stride: 1
batch_size: 32
norm_type: "ZScore"
if_col_norm: False
timeenc: 0
freq: 'h'

# model
num_node: 100
input_dim: 1
rnn_units: 64
output_dim: 1
num_layers: 2
default_graph: False
is_norm_loss: True
embed_dim: 20
cheb_k: 2

early_stoping: True
skip_epoch: 1
save_results: True
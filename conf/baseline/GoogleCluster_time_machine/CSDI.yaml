model_name: csdi
trainer_name: CSDI_trainer
config_path: 'conf/baseline/GoogleCluster_time_machine/CSDI.yaml'
seed: 2024
# training
training_config:
  seed: 2024
  device: "cuda:0"
  mode: "pred"
  save_path: './experiments/csdi/'
  model_path: ''
  valid_nsample: 3
  epochs: 100
  patience: 20
  batch_size: 16
  itr_per_epoch: 1.0e+8
  lr: 1.0e-3
  p1: 15
  p2: 20
  lr_gamma: 0.1
  finetune:
    epochs: 5
    batch_size: 16
    lr: 1.0e-3
    p1: 0.75
    p2: 0.9
    lr_gamma: 0.1
  roll_run: 0
  roll_step: 7
  inverse: True

# data
data_config:
  is_non_stationary: True
  non_stationary_type: 1
  dataset_name: SURF_Dataset
  data_path: ./data/GoogleCluster/cpus_avg_100machines_5min.parquet
  columns: ['all']
  target_cols: ['all']
  feature_cols_da: []
  feature_cols_mask2D: []
  feature_cols_mask1D: []
  data_mode: 2
  unit_len: 1
  training_step: 1
  past_len: 60
  pred_len: 6
  data_len:
    end: "2019-06-01 00:10:00"
    train: 366
    valid: 32
    test: 62
    shift: 0
  data_time:
    train:
      start: "2019-05-01 00:05:00"
      end: "2019-05-22 00:05:00"
    valid:
      start: "2019-05-22 00:10:00"
      end: "2019-05-25 00:10:00"
    test:
      start: "2019-05-25 00:15:00"
      end: "2019-06-01 00:10:00"
  train_val_test_ratio: [0.7, 0.1, 0.2]

# model
model_config:
  nsample: 100
  version: 1
  is_finetune: 0
  diffusion:
    layers: 4
    channels: 64
    nheads: 8
    diffusion_embedding_dim: 128
    beta_start: 0.0001
    beta_end: 0.5
    num_steps: 50
    schedule: "quad"
    is_linear: False
  model:
    is_unconditional: 0
    timeemb: 128
    featureemb: 16
    target_strategy: "test"
    num_sample_features: 256

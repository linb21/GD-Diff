model_name: gd_diff
config_path: conf/baseline/GoogleCluster_time_machine/gd_diff.yaml
seed: 2024

training_config:
  seed: 2024
  device: cuda:0
  mode: pred
  save_path: ./experiments/gd_diff/
  model_path: ""
  valid_nsample: 3
  epochs: 100
  patience: 20
  batch_size: 4
  lr: 1.0e-3
  p1: 15
  p2: 20
  lr_gamma: 0.1
  roll_run: 0
  inverse: true

data_config:
  is_non_stationary: true
  non_stationary_type: 1
  data_path: ./data/GoogleCluster/cpus_avg_100machines_5min.parquet
  graph_dir: ./data/GoogleCluster/interval_graph/
  columns: [all]
  target_cols: [all]
  feature_cols_da: []
  feature_cols_mask2D: []
  feature_cols_mask1D: []
  data_mode: 2
  unit_len: 1
  training_step: 1
  past_len: 60
  pred_len: 6
  train_val_test_ratio: [0.7, 0.1, 0.2]

model_config:
  nsample: 100
  real_time_emb: 1

  diffusion:
    layers: 5
    channels: 64
    nheads: 8
    diffusion_embedding_dim: 128
    beta_start: 0.0001
    beta_end: 0.5
    num_steps: 50
    schedule: quad
    real_time_emb_dim: 16

  model:
    is_unconditional: 0
    timeemb: 128
    featureemb: 16
    num_sample_features: 256

  graph:
    graph_type: time
    graph_freq: minute
    reference_time: "2019-05-01 00:05:00"
    graph_interval: 300
    num_nodes: 100
    embed_dim: 16
    top_k: 10

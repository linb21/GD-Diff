model_name: diffusion
trainer_name: CSDI_trainer
config_path: 'conf/baseline/GoogleCluster_time_machine/TFTD.yaml'
seed: 2024 # 随机数种子
# training
training_config:
  is_non_stationary: True # 决定是否要进行非平稳时间序列的训练，1的话则进行归一化
  non_stationary_type: 1 # 归一化类型：0-仅去中心化，1-标准化
  seed: 2024 # 随机数种子
  device: "cuda:0" # 训练或推理使用的GPU
  mode: "pred" # 'pred'还是'train'
  save_path: './experiments/diffusion/'
  model_path: '' # 如果不为空，则直接加载模型进行推理，否则进行训练
  valid_nsample: 3 # 推理验证集时产生的样本曲线数
  epochs: 20 # 训练轮次
  batch_size: 16 # 单批次样本数目
  itr_per_epoch: 1.0e+8
  lr: 1.0e-3 # 初始学习率
  p1: 15 # 学习率第一次调整轮次
  p2: 18 # 学习率第二次调整轮次
  lr_gamma: 0.1 # 学习率调整比例
  finetune:
    epochs: 5
    batch_size: 16
    lr: 1.0e-3
    p1: 0.75
    p2: 0.9
    lr_gamma: 0.1
  roll_run: 0 # 定义额外滚动测试次数，为0时即为不进行滚动测试，只测试一次
  roll_step: 7 # 定义滚动测试的平移长度为多少个unit_len
  inverse: True #输出结果是否去归一化


# data
data_config:
  is_non_stationary: True # 决定是否要进行非平稳时间序列的训练，1的话则进行归一化
  non_stationary_type: 1 # 归一化类型：0-仅去中心化，1-标准化
  dataset_name: SURF_Dataset
  data_path: ./data/GoogleCluster/cpus_avg_100machines_5min.parquet # 数据所在位置
  columns: ['all'] # 确定取数据中哪些列及其相对位置
  target_cols: ['all'] # 目标列名
  feature_cols_da: [] # 辅助变量，日前
  feature_cols_mask2D: [] # 辅助变量，日内
  feature_cols_mask1D: [] # 辅助变量，日内
  data_mode: 2 # 0的话就是使用数据长度切割数据，1的话就是使用时间切割数据
  unit_len: 1 # 一天的数据序列长度
  training_step: 1 # 训练时偏移的步长
  past_len: 60 # 历史窗长，多少个unit_len
  pred_len: 6 # 预测长度，多少个unit_len
  data_len: # data_mode为0
    end: "2019-06-01 00:10:00"
    train: 366
    valid: 32
    test: 62
    shift: 0
  data_time: # data_mode为1
    train: # 训练集
      start: "2019-05-01 00:05:00"
      end: "2019-05-22 00:05:00"
    valid: # 验证集
      start: "2019-05-22 00:10:00"
      end: "2019-05-25 00:10:00"
    test: # 测试集
      start: "2019-05-25 00:15:00"
      end: "2019-06-01 00:10:00"
  train_val_test_ratio: [0.7, 0.1, 0.2] #data_mode为2

# model
model_config:
  nsample: 10 # 推理时产生的样本曲线数
  version: 1 # 模型版本
  is_finetune: 0 # 决定是否要进行微调训练

  diffusion:
    layers: 5
    channels: 32
    nheads: 8
    diffusion_embedding_dim: 128
    beta_start: 0.0001
    beta_end: 0.5
    num_steps: 50
    schedule: "quad"
    is_linear: True
    trans_version: 1

  model:
    timeemb: 128
    featureemb: 16
    num_sample_features: 64
    gamma: 0.5
    alpha1: 5

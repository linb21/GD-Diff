model_name: d3u
trainer_name: CSDI_trainer
config_path: 'conf/baseline/GoogleCluster_time_machine/D3U.yaml'
root: './'
seed: 2024 # 随机数种子
# training
training_config:
  #timeseries default config
  seed: 2024 # 随机数种子
  des: 'test' # help='exp description'
  device: "cuda:0" # 训练或推理使用的GPU
  is_training: True # 'pred'还是'train'
  do_predict: True
  data: 'SURF_Dataset' # help='dataset name'
  data_name: 'SURF_Dataset'
  # data_path: './datasets/ETTm1/data.pkl'
  features: M
  freq: 'h'
  checkpoints: './experiments/d3u/'
  model_path: '' # 如果不为空，则直接加载模型进行推理，否则进行训练
  #task
  # 此处暂未区分前向模型和后向模型的参数配置区别
  task_name: 'long_term_forecast'
  model_id: 'SURF_Dataset_96_192'
  pretrain_checkpoints: './experiments/patchtst/GoogleCluster/2026-04-29_10:56:21/best_model_0.pth'
  #
  enc_in: 100 # 需要根据实际列数修改
  dec_in: 100  # 需要根据实际列数修改
  c_out: 100   # 需要根据实际列数修改
  d_model_c: 128
  e_layers_c: 1
  d_layers_c: 1
  d_ff: 256
  moving_avg: 25
  factor_c: 3
  n_heads_c: 8
  distil: True
  label_len: 0
  #forecasting task

  inverse: True
  seasonal_patterns: 'Monthly' #help='subset for M4

  #optimization
  num_workers: 10
  itr: 1
  train_epochs: 100
  batch_size: 16 # help='batch size of train input data'
  patience: 5 #help='early stopping patience'
  learning_rate: 0.0001
  loss: 'MSE' #loss function
  lradj: 'type1' #help='adjust learning rate'
  use_amp: False #help='use automatic mixed precision training', default=False
  test_batch_size: 1
  learning_rate_Cond: 0.0001

  # de-stationary projector params
  p_hidden_dims: [64,64] #help='hidden layer dimensions of projector (List)')
  p_hidden_layers: 2

  # metrics (dtw)
  use_dtw: False #help='the controller of using dtw metric (dtw is time consuming, not suggested unless necessary)'

  k_z: 0.01
  k_cond: 1
  d_z: 8

  save_path: './experiments/d3u/'

  #扩散模型配置
  diffusion_config_dir: './conf/baseline/GoogleCluster_time_machine/D3U.yaml'

  use_gpu: True
  use_multi_gpu: False
  devices: "0,1,2,3"


# data
data_config:
  is_non_stationary: False # 决定是否要进行非平稳时间序列的训练，1的话则进行归一化
  non_stationary_type: 1 # 归一化类型：0-仅去中心化，1-标准化
  dataset_name: SURF_Dataset
  data_path: ./data/GoogleCluster/cpus_avg_100machines_5min.parquet # 数据所在位置
  columns: ['all'] # 确定取数据中哪些列及其相对位置
  target_cols: ['all'] # 目标列名
  feature_cols_da: [] # 辅助变量，日前
  feature_cols_mask2D: [] # 辅助变量，日内
  feature_cols_mask1D: [] # 辅助变量，日内
  data_mode: 2 # 0的话就是使用数据长度切割数据，1的话就是使用时间切割数据
  unit_len: 1 # 一天的数据序列长度
  training_step: 1 # 训练时偏移的步长
  past_len: 60 # 历史窗长，多少个unit_len
  pred_len: 6 # 预测长度，多少个unit_len
  data_len: # data_mode为0
    end: "2019-06-01 00:10:00"
    train: 366
    valid: 32
    test: 62
    shift: 0
  data_time: # data_mode为1
    train: # 训练集
      start: "2019-05-01 00:05:00"
      end: "2019-05-22 00:05:00"
    valid: # 验证集
      start: "2019-05-22 00:10:00"
      end: "2019-05-25 00:10:00"
    test: # 测试集
      start: "2019-05-25 00:15:00"
      end: "2019-06-01 00:10:00"
  train_val_test_ratio: [0.7, 0.1, 0.2] #data_mode为2

# model
model_config:
  cond_model: PatchTST
  model_name: d3u
  dropout: 0.1
  embed: 'timeF'
  activation: 'gelu'
  output_attention: False
  channel_independence: 1 #help='0: channel dependence 1: channel independence for FreTS model'
  decomp_method: 'moving_avg' #help='method of series decompsition, only support moving_avg or dft_decomp')
  use_norm: 1 #help='whether to use normalize; True 1 False 0'
  down_sampling_layers: 3   #help='whether to use normalize; True 1 False 0'
  down_sampling_window: 2   #help='num of down sampling layers'
  down_sampling_method: 'avg' #help='down sampling method, only support avg, max, conv'


  # PatchDN
  denoise_model: PatchDN
  patch_size: 2
  stride: 4
  padding_patch: 'end'
  depth: 1
  d_model_d: 256
  n_heads_d: 8

  # U-Net
  ddpm_inp_embed: 256
  ddpm_dim_diff_steps: 256
  ddpm_channels_conv: 256
  ddpm_channels_fusion_I: 256
  ddpm_layers_inp: 5
  ddpm_layers_I: 5
  ddpm_layers_II: 5
  cond_ddpm_num_layers: 5
  cond_ddpm_channels_conv: 64
  # Series Decomposition
  decomposition: False
  kernel_size: 15
  fourier_factor: 1.0


  seg_len: 6


  #augmentation_ratio
  augmentation_ratio: 0  # How many times to augment
  jitter: false  # Jitter preset augmentation
  scaling: false  # Scaling preset augmentation
  permutation: false  # Equal Length Permutation preset augmentation
  randompermutation: false  # Random Length Permutation preset augmentation
  magwarp: false  # Magnitude warp preset augmentation
  timewarp: false  # Time warp preset augmentation
  windowslice: false  # Window slice preset augmentation
  windowwarp: false  # Window warp preset augmentation
  rotation: false  # Rotation preset augmentation
  spawner: false  # SPAWNER preset augmentation
  dtwwarp: false  # DTW warp preset augmentation
  shapedtwwarp: false  # Shape DTW warp preset augmentation
  wdba: false  # Weighted DBA preset augmentation
  discdtw: false  # Discriminative DTW warp preset augmentation
  discsdtw: false  # Discriminative shape DTW warp preset augmentation
  extra_tag: ""  # Anything extra


  # CART related args
  cond_pred_model_pertrain_dir: './experiments/patchtst/GoogleCluster/2026-04-29_10:56:21/best_model_0.pth'
  CART_input_x_embed_dim: 32
  mse_timestep: 0
  MLP_diffusion_net: False

  # Some args for Ax (all about diffusion part)
  timesteps: 100
  sampling_timesteps: 50
  fastsample: False
  type_sampler: 'DDIM'
  DPMsolver_step: 20
  eta: 1
  parameterization: 'noise'
  bias: False
  use_pretraining_condition: False

  # rebuttal exps
  cond_pred_model_requires_grad: False
  from_scrach: False
  scrach_10_stop: False
  bias_y_0: False

  # PatchTST
  fc_dropout: 0.05
  head_dropout: 0.0

  # NSformer
  p_hidden_dims: [64, 64]
  p_hidden_layers: 2

  # Sparse-VQ
  wFFN: 1
  svq: 1
  codebook_size: 128
  sout: 0
  individual: 0
  revin: 1
  affine: 0
  subtract_last: 0
  length: 96
  num_codebook: 4

  # iTransformer


  data:
      dataset: "8gauss"
      true_function: None
      dataset_size: 10240
      seed: 2000
      no_multimodality: False
      inverse_xy: False
      x_dict: {"ct_toy_name": "8gaussians"}
      noise_dict: {}
      train_ratio: 0.8
      num_workers: 0
      normalize_x: False
      normalize_y: False

  model:
      type: "simple"
      data_dim: 2
      x_dim: 1
      y_dim: 1
      z_dim: 2
      cat_x: True
      cat_y_pred: True
      feature_dim: 128
      var_type: fixedlarge
      ema_rate: 0.9999
      ema: True

  diffusion:
      beta_schedule: linear  # cosine_anneal
      beta_start: 0.0001
      beta_end: 0.1
      timesteps: 1000
      vis_step: 100
      num_figs: 10
      conditioning_signal: "NN"
      nonlinear_guidance:
          pre_train: True
          joint_train: False
          n_pretrain_epochs: 100
          logging_interval: 10
          hid_layers: [100, 50]
          use_batchnorm: False
          negative_slope: 0.01
          dropout_rate: 0.0
          apply_early_stopping: False
          n_pretrain_max_epochs: 1000
          train_ratio: 0.6
          patience: 50
          delta: 0

  training:
      batch_size: 256
      n_epochs: 5000
      n_iters: 100000
      snapshot_freq: 1000000000
      logging_freq: 1000
      validation_freq: 128000
      image_folder: 'training_image_samples'

  sampling:
      batch_size: 32
      sampling_size: 1000
      last_only: True
      image_folder: 'sampling_image_samples'

  testing:
      batch_size: 32
      sampling_size: 1000
      last_only: True
      plot_freq: 200
      image_folder: 'testing_image_samples'
      n_z_samples: 100
      n_z_samples_depart: 1
      n_bins: 10

      compute_metric_all_steps: True
      mean_t: 0
      coverage_t: 0
      nll_t: 0
      vis_t: 0
      trimmed_mean_range: [0.0, 100.0]
      PICP_range: [2.5, 97.5]
      make_plot: True
      squared_plot: True
      plot_true: True
      plot_gen: True
      fig_size: [8, 5]
      one_fig_size: [4, 4]

  optim:
      weight_decay: 0.000
      optimizer: "Adam"
      lr: 0.001
      beta1: 0.9
      amsgrad: false
      eps: 0.00000001
      grad_clip: 1.0

  aux_optim:
      weight_decay: 0.000
      optimizer: "Adam"
      lr: 0.001
      beta1: 0.9
      amsgrad: True
      eps: 0.00000001
      grad_clip: 1.0
